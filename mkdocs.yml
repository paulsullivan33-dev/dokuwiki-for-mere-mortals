site_name: DokuWiki for Mere Mortals
site_description: A wiki your group can edit in the browser that keeps every page as a plain text file, with no database to run. Installing DokuWiki, writing pages in its syntax, organising them in namespaces, adding users and tested permissions, following the history of every page, and knowing its limits, with the privacy line stated plainly.
site_url: https://paulsullivan33-dev.github.io/dokuwiki-for-mere-mortals/
